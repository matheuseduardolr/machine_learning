[project]
name = "project-clustering-kmeans"
version = "0.1.0"
description = "Agrupa condomínios em núcleos geográficos com K-Means"
readme = "README.md"
authors = [
    { name = "Matheus Eduardo", email = "matheuslrego7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "geopy>=2.5.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.8",
    "scipy>=1.18.1",
]

[project.scripts]
project-clustering-kmeans = "project_clustering_kmeans:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
